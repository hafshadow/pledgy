const P = {"en": {"title": "Privacy Policy", "updated": "Last updated: 2026-11-18", "intro": "Pledgy is a Telegram bot that helps you keep your habits. This page explains which data the bot processes and why.", "sections": [["Who is responsible", "Pledgy is operated by the Pledgy team. You can reach us at any time inside the bot with /paysupport."], ["What we process", "Your Telegram user ID, first name, username and language; your time-zone and reminder settings; your goals, daily proofs (photos, videos and notes you send to the bot), jokers, badges and challenge results; payment records of Telegram Stars (amount, date and Telegram's payment ID); referral links you used; and optional feedback you give."], ["Why", "Only to run the service: checking your daily proofs, sending reminders, refunding Stars when you complete a goal, showing leaderboards and statistics, preventing fraud (for example reused photos) and answering support requests. We do not use your data for advertising and we never sell it."], ["Who else sees it", "Payments are processed by Telegram. If you add a referee or join a challenge, they see your goal title, progress and the proofs relevant to them. If automatic photo checking is enabled, proof photos are sent to Anthropic's AI service for that check only. No other third parties receive your data."], ["Storage", "Photos and videos stay on Telegram's servers; the bot only stores references to them. All other data is stored in the bot's database and in its backups. We keep it while you use the bot and as long as payment records must be kept by law."], ["Your rights", "You can ask to see, correct or delete your data at any time with /paysupport. Data needed to complete an active goal with Stars at stake or to document payments may be kept until that is finished. If you live in the EU, you also have the right to complain to a data protection authority."], ["Children", "Pledgy is not intended for people under 16."], ["Changes", "If this policy changes, we update this page and the date above."]], "terms": "Terms & Refund Policy", "other": "This policy is shown in English.", "back": "← Back"}, "tr": {"title": "Gizlilik Politikası", "updated": "Son güncelleme: 2026-11-18", "intro": "Pledgy, alışkanlıklarını sürdürmene yardım eden bir Telegram botudur. Bu sayfa botun hangi verileri neden işlediğini açıklar.", "sections": [["Sorumlu kim?", "Pledgy'yi Pledgy ekibi işletir. Bize istediğin zaman bot içinden /paysupport ile ulaşabilirsin."], ["Hangi verileri işliyoruz?", "Telegram kullanıcı kimliğin, adın, kullanıcı adın ve dilin; saat dilimi ve hatırlatma ayarların; hedeflerin, günlük kanıtların (bota gönderdiğin fotoğraf, video ve notlar), jokerlerin, rozetlerin ve meydan okuma sonuçların; Telegram Stars ödeme kayıtların (tutar, tarih ve Telegram'ın ödeme kimliği); kullandığın davet linkleri ve isteğe bağlı olarak verdiğin geri bildirimler."], ["Neden?", "Yalnızca hizmeti sunmak için: günlük kanıtlarını kontrol etmek, hatırlatma göndermek, hedefini tamamladığında Stars'ını iade etmek, sıralama ve istatistik göstermek, hileyi (ör. aynı fotoğrafın tekrar kullanılması) önlemek ve destek taleplerine cevap vermek. Verilerini reklam için kullanmayız ve asla satmayız."], ["Başka kim görür?", "Ödemeleri Telegram işler. Hakem eklersen ya da bir meydan okumaya katılırsan, onlar hedefinin adını, ilerlemeni ve kendilerini ilgilendiren kanıtları görür. Otomatik fotoğraf kontrolü açıksa kanıt fotoğrafları yalnızca bu kontrol için Anthropic'in yapay zeka hizmetine gönderilir. Başka hiçbir üçüncü tarafa veri verilmez."], ["Saklama", "Fotoğraf ve videolar Telegram'ın sunucularında kalır; bot yalnızca onlara ait referansları saklar. Diğer tüm veriler botun veritabanında ve yedeklerinde tutulur. Botu kullandığın sürece ve ödeme kayıtlarının yasal olarak saklanması gereken süre boyunca saklanır."], ["Hakların", "Verilerini görmeyi, düzeltmeyi ya da silinmesini istediğin zaman /paysupport ile isteyebilirsin. Stars yatırılmış aktif bir hedefi sonuçlandırmak ya da ödemeleri belgelemek için gereken veriler bu işlem bitene kadar tutulabilir. AB'de ya da Türkiye'de yaşıyorsan veri koruma kurumuna şikâyet hakkın da vardır."], ["Çocuklar", "Pledgy 16 yaşından küçükler için tasarlanmamıştır."], ["Değişiklikler", "Bu politika değişirse bu sayfayı ve yukarıdaki tarihi güncelleriz."]], "terms": "Kullanım Koşulları ve İade Politikası", "other": "", "back": "← Geri"}, "de": {"title": "Datenschutzerklärung", "updated": "Zuletzt aktualisiert: 2026-11-18", "intro": "Pledgy ist ein Telegram-Bot, der dir hilft, deine Gewohnheiten durchzuhalten. Hier erfährst du, welche Daten der Bot verarbeitet und warum.", "sections": [["Verantwortlich", "Betreiber von Pledgy: Pledgy-Team. Du erreichst uns jederzeit im Bot mit /paysupport."], ["Welche Daten", "Deine Telegram-Nutzer-ID, dein Vorname, Benutzername und deine Sprache; Zeitzone und Erinnerungseinstellungen; deine Ziele, täglichen Beweise (Fotos, Videos und Notizen, die du an den Bot schickst), Joker, Abzeichen und Challenge-Ergebnisse; Zahlungsdaten zu Telegram Stars (Betrag, Datum und Zahlungs-ID von Telegram); genutzte Einladungslinks sowie freiwilliges Feedback."], ["Wozu", "Ausschließlich zum Betrieb des Dienstes: Prüfen deiner täglichen Beweise, Erinnerungen, Erstattung der Stars bei erreichtem Ziel, Ranglisten und Statistiken, Betrugsvermeidung (z. B. wiederverwendete Fotos) und Beantwortung von Supportanfragen (Art. 6 Abs. 1 lit. b DSGVO). Wir nutzen deine Daten nicht für Werbung und verkaufen sie nie."], ["Wer sie sieht", "Zahlungen wickelt Telegram ab. Wenn du einen Schiedsrichter hinzufügst oder an einer Challenge teilnimmst, sehen diese deinen Zieltitel, deinen Fortschritt und die für sie relevanten Beweise. Ist die automatische Fotoprüfung aktiviert, werden Beweisfotos nur dafür an den KI-Dienst von Anthropic übermittelt. Andere Dritte erhalten keine Daten."], ["Speicherung", "Fotos und Videos bleiben auf den Servern von Telegram; der Bot speichert nur Verweise darauf. Alle anderen Daten liegen in der Datenbank des Bots und in deren Sicherungen. Wir speichern sie, solange du den Bot nutzt und solange Zahlungsbelege gesetzlich aufbewahrt werden müssen."], ["Deine Rechte", "Du kannst jederzeit mit /paysupport Auskunft, Berichtigung oder Löschung deiner Daten verlangen. Daten, die zum Abschluss eines laufenden Ziels mit Einsatz oder zur Dokumentation von Zahlungen nötig sind, können bis dahin aufbewahrt werden. Du hast außerdem das Recht, dich bei einer Datenschutz-Aufsichtsbehörde zu beschweren."], ["Kinder", "Pledgy richtet sich nicht an Personen unter 16 Jahren."], ["Änderungen", "Ändert sich diese Erklärung, aktualisieren wir diese Seite und das Datum oben."]], "terms": "Nutzungsbedingungen & Erstattung", "other": "", "back": "← Zurück"}};
const T = {"en": "1. Pledgy is a commitment tool that helps you keep a promise to yourself. It is not a bet or a game of chance: the outcome depends only on you.\n2. If you complete your goal without missing a day, your staked Stars are refunded automatically.\n3. If you miss a day (without a joker) or give up, your stake is not refunded.\n4. Joker purchases are not refundable.\n5. Your referee may approve or reject proofs. If they don't decide by 12:00 the next day, the proof counts as approved.\n6. Days end at midnight in the time zone you set when creating the goal.\n7. If you believe a goal failed because of a technical error, contact /paysupport. We review every case and refund when appropriate.\n8. Fake proofs or abuse of the system may lead to loss of access.\n\nBy using Pledgy you accept these terms.\n\n🔁 Second chance: within 24 hours of a failed goal you can continue once per goal for 50 ⭐; the missed day then counts as done. Second-chance payments are not refundable.\n\n🎁 Gifted goals: the Stars belong to the person who paid. If the friend completes the goal, they are refunded to the payer; if not, they are not refunded. A gift not used within 7 days is refunded automatically.", "tr": "1. Pledgy, kendine verdiğin sözü tutmana yardım eden bir taahhüt aracıdır. Bahis ya da şans oyunu değildir: sonuç tamamen senin elindedir.\n2. Hedefini bir gün bile kaçırmadan tamamlarsan yatırdığın Stars otomatik olarak iade edilir.\n3. Bir günü (joker kullanmadan) kaçırırsan ya da hedeften çekilirsen yatırdığın Stars iade edilmez.\n4. Joker ödemeleri iade edilmez.\n5. Hakemin kanıtları onaylayabilir ya da reddedebilir. Ertesi gün 12:00'a kadar karar vermezse kanıt onaylanmış sayılır.\n6. Günler, hedefi oluştururken ayarladığın saat dilimine göre gece yarısı biter.\n7. Hedefinin teknik bir hata nedeniyle başarısız olduğunu düşünüyorsan /paysupport ile yaz. Her durumu inceler, gerekirse iade ederiz.\n8. Sahte kanıt ya da sistemin kötüye kullanılması erişimin kapatılmasına yol açabilir.\n\nPledgy'yi kullanarak bu koşulları kabul etmiş olursun.\n\n🔁 İkinci şans: Başarısız olan bir hedefe 24 saat içinde, hedef başına bir kez 50 ⭐ ödeyerek devam edebilirsin; kaçırılan gün tamam sayılır. İkinci şans ödemeleri iade edilmez.\n\n🎁 Hediye hedefler: Stars, ödemeyi yapan kişiye aittir. Arkadaşın hedefi tamamlarsa ödeme yapana iade edilir, tamamlayamazsa iade edilmez. 7 gün içinde kullanılmayan hediye otomatik olarak iade edilir.", "ru": "1. Pledgy — инструмент обязательств, который помогает сдержать слово, данное себе. Это не ставка и не азартная игра: результат зависит только от тебя.\n2. Если ты выполнишь цель без пропусков, поставленные Stars вернутся автоматически.\n3. Если ты пропустишь день (без джокера) или бросишь цель, ставка не возвращается.\n4. Покупки джокеров не возвращаются.\n5. Судья может одобрять или отклонять доказательства. Если он не решит до 12:00 следующего дня, доказательство считается одобренным.\n6. Дни заканчиваются в полночь по часовому поясу, выбранному при создании цели.\n7. Если считаешь, что цель провалена из-за технической ошибки, напиши в /paysupport. Мы рассматриваем каждый случай и при необходимости возвращаем Stars.\n8. Фальшивые доказательства или злоупотребления могут привести к блокировке доступа.\n\nПользуясь Pledgy, ты принимаешь эти условия.\n\n🔁 Второй шанс: в течение 24 часов после провала цели можно продолжить её один раз за 50 ⭐; пропущенный день засчитывается. Оплата второго шанса не возвращается.\n\n🎁 Подаренные цели: Stars принадлежат тому, кто заплатил. Если друг выполнит цель, они вернутся плательщику; если нет — не вернутся. Подарок, не использованный за 7 дней, возвращается автоматически.", "de": "1. Pledgy ist ein Werkzeug, das dir hilft, ein Versprechen an dich selbst zu halten. Es ist keine Wette und kein Glücksspiel: Das Ergebnis hängt nur von dir ab.\n2. Schaffst du dein Ziel ohne verpassten Tag, werden deine eingesetzten Stars automatisch erstattet.\n3. Verpasst du einen Tag (ohne Joker) oder gibst auf, wird der Einsatz nicht erstattet.\n4. Joker-Käufe werden nicht erstattet.\n5. Dein Schiedsrichter kann Beweise bestätigen oder ablehnen. Entscheidet er nicht bis 12:00 am nächsten Tag, gilt der Beweis als bestätigt.\n6. Tage enden um Mitternacht in der Zeitzone, die du beim Erstellen des Ziels eingestellt hast.\n7. Glaubst du, dass ein Ziel wegen eines technischen Fehlers gescheitert ist, melde dich über /paysupport. Wir prüfen jeden Fall und erstatten, wenn es angemessen ist.\n8. Gefälschte Beweise oder Missbrauch können zum Ausschluss führen.\n\nMit der Nutzung von Pledgy akzeptierst du diese Bedingungen.\n\n🔁 Zweite Chance: Innerhalb von 24 Stunden nach einem gescheiterten Ziel kannst du einmal pro Ziel für 50 ⭐ weitermachen; der verpasste Tag zählt dann als erledigt. Zahlungen für die zweite Chance werden nicht erstattet.\n\n🎁 Geschenkte Ziele: Die Stars gehören der Person, die bezahlt hat. Schafft der Freund das Ziel, werden sie an sie erstattet, sonst nicht. Ein Geschenk, das 7 Tage lang nicht eingelöst wird, wird automatisch erstattet.", "es": "1. Pledgy es una herramienta de compromiso que te ayuda a cumplir una promesa contigo mismo. No es una apuesta ni un juego de azar: el resultado depende solo de ti.\n2. Si cumples tu meta sin fallar ningún día, tus Stars apostadas se devuelven automáticamente.\n3. Si fallas un día (sin comodín) o abandonas, la apuesta no se devuelve.\n4. Las compras de comodines no son reembolsables.\n5. Tu árbitro puede aprobar o rechazar pruebas. Si no decide antes de las 12:00 del día siguiente, la prueba cuenta como aprobada.\n6. Los días terminan a medianoche en la zona horaria que configuraste al crear la meta.\n7. Si crees que una meta falló por un error técnico, escríbenos en /paysupport. Revisamos cada caso y reembolsamos cuando corresponde.\n8. Las pruebas falsas o el abuso del sistema pueden llevar a perder el acceso.\n\nAl usar Pledgy aceptas estas condiciones.\n\n🔁 Segunda oportunidad: dentro de las 24 horas posteriores a una meta fallida puedes continuar una vez por meta pagando 50 ⭐; el día fallado cuenta como hecho. Los pagos de segunda oportunidad no son reembolsables.\n\n🎁 Metas regaladas: las Stars pertenecen a quien pagó. Si el amigo cumple la meta, se le reembolsan a quien pagó; si no, no se reembolsan. Un regalo no usado en 7 días se reembolsa automáticamente.", "pt": "1. O Pledgy é uma ferramenta de compromisso que ajuda você a cumprir uma promessa feita a si mesmo. Não é aposta nem jogo de azar: o resultado depende só de você.\n2. Se você concluir a meta sem falhar nenhum dia, suas Stars apostadas são devolvidas automaticamente.\n3. Se falhar um dia (sem coringa) ou desistir, a aposta não é devolvida.\n4. Compras de coringas não são reembolsáveis.\n5. Seu juiz pode aprovar ou rejeitar provas. Se ele não decidir até 12:00 do dia seguinte, a prova conta como aprovada.\n6. Os dias terminam à meia-noite no fuso horário definido ao criar a meta.\n7. Se você acha que uma meta falhou por erro técnico, fale conosco em /paysupport. Analisamos cada caso e reembolsamos quando for o caso.\n8. Provas falsas ou abuso do sistema podem levar à perda de acesso.\n\nAo usar o Pledgy você aceita estes termos.\n\n🔁 Segunda chance: até 24 horas após uma meta falhar, você pode continuar uma vez por meta pagando 50 ⭐; o dia perdido passa a contar como feito. Pagamentos de segunda chance não são reembolsáveis.\n\n🎁 Metas presenteadas: as Stars pertencem a quem pagou. Se o amigo cumprir a meta, elas são reembolsadas a quem pagou; se não, não são. Um presente não usado em 7 dias é reembolsado automaticamente.", "fa": "1. Pledgy ابزاری برای پایبندی است که کمکت می‌کند به قولی که به خودت داده‌ای عمل کنی. شرط‌بندی یا بازی شانسی نیست: نتیجه فقط به خودت بستگی دارد.\n2. اگر هدفت را بی‌آنکه روزی جا بیندازی تمام کنی، Stars گذاشته‌شده خودکار برمی‌گردد.\n3. اگر روزی را (بدون جوکر) جا بیندازی یا هدف را رها کنی، مبلغ برنمی‌گردد.\n4. خرید جوکر بازپرداخت نمی‌شود.\n5. داورت می‌تواند مدرک‌ها را تأیید یا رد کند. اگر تا ساعت 12:00 روز بعد تصمیم نگیرد، مدرک تأییدشده حساب می‌شود.\n6. روزها در نیمه‌شبِ منطقهٔ زمانی‌ای که هنگام ساختن هدف تنظیم کرده‌ای تمام می‌شوند.\n7. اگر فکر می‌کنی هدفت به خاطر خطای فنی شکست خورده، از /paysupport با ما تماس بگیر. هر مورد را بررسی می‌کنیم و در صورت لزوم بازپرداخت می‌کنیم.\n8. مدرک جعلی یا سوءاستفاده از سیستم ممکن است به قطع دسترسی منجر شود.\n\nبا استفاده از Pledgy این شرایط را می‌پذیری.\n\n🔁 فرصت دوم: تا ۲۴ ساعت پس از شکست یک هدف، می‌توانی برای هر هدف یک بار با پرداخت 50 ⭐ ادامه دهی؛ روز جاافتاده انجام‌شده حساب می‌شود. پرداخت فرصت دوم بازپرداخت نمی‌شود.\n\n🎁 هدف‌های هدیه: Stars متعلق به کسی است که پرداخت کرده. اگر دوست هدف را کامل کند به پرداخت‌کننده برمی‌گردد، وگرنه برنمی‌گردد. هدیه‌ای که ۷ روز استفاده نشود خودکار بازپرداخت می‌شود.", "uz": "1. Pledgy — oʻzingga bergan va'dangda turishga yordam beradigan majburiyat vositasi. Bu garov yoki tavakkal oʻyini emas: natija faqat senga bogʻliq.\n2. Maqsadni birorta kunni oʻtkazmasdan bajarsang, tikilgan Stars avtomatik qaytariladi.\n3. Bir kunni (jokersiz) oʻtkazsang yoki voz kechsang, tikish qaytarilmaydi.\n4. Joker xaridlari qaytarilmaydi.\n5. Hakaming isbotlarni tasdiqlashi yoki rad etishi mumkin. Ertasi kuni soat 12:00 gacha qaror qilmasa, isbot tasdiqlangan hisoblanadi.\n6. Kunlar maqsad yaratishda tanlagan vaqt mintaqangdagi yarim tunda tugaydi.\n7. Maqsad texnik xato tufayli muvaffaqiyatsiz boʻldi deb hisoblasang, /paysupport orqali yoz. Har bir holatni koʻrib chiqamiz va zarur boʻlsa qaytaramiz.\n8. Soxta isbotlar yoki tizimni suiiste'mol qilish kirishning yopilishiga olib kelishi mumkin.\n\nPledgy dan foydalanib, bu shartlarni qabul qilasan.\n\n🔁 Ikkinchi imkoniyat: maqsad muvaffaqiyatsiz boʻlgach 24 soat ichida har maqsadga bir marta 50 ⭐ toʻlab davom etishing mumkin; oʻtkazilgan kun bajarilgan hisoblanadi. Ikkinchi imkoniyat toʻlovlari qaytarilmaydi.\n\n🎁 Sovgʻa maqsadlar: Stars toʻlov qilgan kishiga tegishli. Doʻst maqsadni bajarsa, toʻlovchiga qaytariladi, bajarmasa qaytarilmaydi. 7 kun ichida ishlatilmagan sovgʻa avtomatik qaytariladi.", "ar": "1. Pledgy أداة التزام تساعدك على الوفاء بوعد قطعته لنفسك. ليست رهانًا ولا لعبة حظ: النتيجة تعتمد عليك وحدك.\n2. إن أنجزت هدفك دون أن تفوّت يومًا، تُسترد Stars المراهَن بها تلقائيًا.\n3. إن فوّتّ يومًا (دون جوكر) أو تخلّيت عن الهدف، لا يُسترد الرهان.\n4. مشتريات الجوكر غير قابلة للاسترداد.\n5. يمكن لحَكَمك قبول الإثباتات أو رفضها. إن لم يقرّر حتى الساعة 12:00 من اليوم التالي، يُعدّ الإثبات مقبولًا.\n6. تنتهي الأيام عند منتصف الليل حسب المنطقة الزمنية التي ضبطتها عند إنشاء الهدف.\n7. إن رأيت أن هدفك فشل بسبب خطأ تقني، تواصل معنا عبر /paysupport. نراجع كل حالة ونسترد المبلغ عند الاقتضاء.\n8. الإثباتات المزيفة أو إساءة استخدام النظام قد تؤدي إلى إيقاف الوصول.\n\nباستخدامك Pledgy فإنك توافق على هذه الشروط.\n\n🔁 الفرصة الثانية: خلال 24 ساعة من فشل الهدف يمكنك المتابعة مرة واحدة لكل هدف مقابل 50 ⭐؛ ويُحسب اليوم الفائت منجَزًا. مدفوعات الفرصة الثانية غير قابلة للاسترداد.\n\n🎁 الأهداف المُهداة: النجوم ملك من دفع. إذا أكمل الصديق الهدف تُعاد إلى الدافع، وإلا فلا. الهدية غير المستخدمة خلال 7 أيام تُسترد تلقائيًا."};
const NAMES = {"en": "🇬🇧 English", "tr": "🇹🇷 Türkçe", "ru": "🇷🇺 Русский", "de": "🇩🇪 Deutsch", "es": "🇪🇸 Español", "pt": "🇧🇷 Português", "fa": "🇮🇷 فارسی", "uz": "🇺🇿 Oʻzbekcha", "ar": "🇸🇦 العربية"};
const RTL = ["fa", "ar"];
function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const c = String(l).slice(0, 2).toLowerCase();
    if (T[c]) return c;
  }
  return "en";
}
function render() {
  const lang = pick();
  const p = P[lang] || P.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.includes(lang) && P[lang] ? "rtl" : "ltr";
  document.title = "Pledgy — " + p.title;
  const opts = Object.keys(T).map(k => `<option value="${k}"${k === lang ? " selected" : ""}>${NAMES[k]}</option>`).join("");
  const secs = p.sections.map(([h, b]) => `<h2>${h}</h2><p>${b}</p>`).join("");
  const note = !P[lang] && P.en.other ? `<p class="muted">${P.en.other}</p>` : "";
  document.getElementById("app").innerHTML = `
    <div class="top"><a href="./?lang=${lang}">${p.back}</a><select id="l">${opts}</select></div>
    <h1>${p.title}</h1><div class="muted">${p.updated}</div>${note}
    <div class="card"><p>${p.intro}</p>${secs}</div>
    <h1 id="terms">${(P[lang] || P.en).terms}</h1>
    <div class="card terms">${T[lang]}</div>`;
  document.getElementById("l").onchange = e => { history.replaceState(null, "", "?lang=" + e.target.value); render(); };
}
render();
</script>
</body>
</html>
