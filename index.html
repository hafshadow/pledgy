<head>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f6f4fb);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1d1636);
    --hint: var(--tg-theme-hint-color, #8b84a3);
    --accent: var(--tg-theme-button-color, #4b2bb8);
    --gold: #ffc229;
    --done: #22b573;
    --missed: #ef5a6f;
    --rest: color-mix(in srgb, var(--hint) 22%, transparent);
    --line: color-mix(in srgb, var(--hint) 18%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 32px; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }
  .hero { display: flex; align-items: center; gap: 12px; margin: 4px 2px 18px; }
  .logo {
    width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 38%, #5a37d0, #2a1872 60%, #140b3a); font-size: 26px;
    box-shadow: 0 4px 14px rgba(75, 43, 184, .35);
  }
  .hero h1 { margin: 0; font-size: 21px; letter-spacing: -.2px; }
  .hero p { margin: 2px 0 0; color: var(--hint); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat { background: var(--card); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .stat b { display: block; font-size: 20px; letter-spacing: -.3px; }
  .stat span { color: var(--hint); font-size: 11px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--hint); margin: 20px 4px 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { background: var(--card); border-radius: 999px; padding: 6px 11px; font-size: 13px; }
  .badge.off { opacity: .38; filter: grayscale(1); }
  .goal { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .goal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .goal h3 { margin: 0; font-size: 16px; }
  .goal .plan { color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .chip.success { background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done); }
  .chip.failed, .chip.cancelled { background: color-mix(in srgb, var(--missed) 14%, transparent); color: var(--missed); }
  .bar { height: 8px; border-radius: 99px; background: var(--rest); margin: 12px 0 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #8a6cff); }
  .count { font-size: 12px; color: var(--hint); }
  .week-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--hint); margin: 10px 2px 4px; }
  .week-label .ok { color: var(--done); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
  .week-label + .grid { margin-top: 0; }
  .day {
    aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center; font-size: 11.5px;
    background: var(--rest); color: var(--hint);
  }
  .day.done { background: var(--done); color: #fff; font-weight: 600; }
  .day.missed { background: color-mix(in srgb, var(--missed) 85%, transparent); color: #fff; }
  .day.today { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--text); }
  .day.future { opacity: .45; }
  .day.pause { background: color-mix(in srgb, #3ba7f5 30%, transparent); color: var(--text); }
  .legend { display: flex; gap: 12px; color: var(--hint); font-size: 11.5px; margin-top: 10px; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .l-done::before { background: var(--done); }
  .legend .l-missed::before { background: var(--missed); }
  .legend .l-today::before { outline: 2px solid var(--accent); outline-offset: -2px; background: transparent; }
  .legend .l-pause::before { background: color-mix(in srgb, #3ba7f5 45%, transparent); }
  .legend span::before { margin-right: 0; margin-inline-end: 5px; }
  .empty { text-align: center; color: var(--hint); padding: 30px 16px; background: var(--card); border-radius: 18px; }
  /* ---- tanıtım sayfası (Telegram dışında açılınca) ---- */
  body.site { padding: 0; background: #f6f4fb; color: #1d1636; }
  .site .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  .site header { background: radial-gradient(120% 140% at 50% 0%, #5a37d0 0%, #2a1872 55%, #140b3a 100%); color: #fff; padding: 18px 0 64px; }
  .site nav { display: flex; justify-content: space-between; align-items: center; }
  .site nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .site nav img { width: 36px; height: 36px; border-radius: 50%; }
  .site select { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 6px 8px; font: inherit; font-size: 14px; }
  .site select option { color: #1d1636; }
  .site .hero-l { text-align: center; padding-top: 48px; }
  .site .hero-l img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .site .hero-l h1 { font-size: clamp(30px, 6vw, 46px); letter-spacing: -1px; margin: 22px 0 12px; line-height: 1.1; }
  .site .hero-l p { font-size: 18px; max-width: 600px; margin: 0 auto; opacity: .88; }
  .site .cta { display: inline-block; margin-top: 28px; background: #ffc229; color: #1d1636; font-weight: 700; font-size: 17px; padding: 15px 30px; border-radius: 14px; text-decoration: none; box-shadow: 0 8px 24px rgba(255,194,41,.35); }
  .site .cta:hover { transform: translateY(-1px); }
  .site .free { margin-top: 12px; font-size: 13.5px; opacity: .75; }
  .site section { padding: 46px 0 6px; }
  .site h2.s { text-transform: none; letter-spacing: -.4px; color: #1d1636; font-size: 26px; margin: 0 0 18px; text-align: center; }
  .site .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .site .c { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 2px 10px rgba(29,22,54,.05); }
  .site .c h3 { margin: 0 0 6px; font-size: 17px; }
  .site .c p { margin: 0; color: #5d5674; }
  .site .cards.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .site .num { width: 30px; height: 30px; border-radius: 50%; background: #4b2bb8; color: #fff; display: grid; place-items: center; font-weight: 700; margin-bottom: 10px; }
  .site details { background: #fff; border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; }
  .site summary { font-weight: 600; cursor: pointer; }
  .site details p { color: #5d5674; margin: 10px 0 0; }
  .site .end { text-align: center; padding: 40px 0 10px; }
  .site footer { text-align: center; color: #8b84a3; font-size: 13.5px; padding: 30px 0 40px; }
  .site footer a { color: #4b2bb8; }
</style>
</head>

function siteLang() {

  return "en";
}

function decode(hash) {
  const m = /(?:^|[#&])d=([^&]+)/.exec(hash || "");
  if (!m) return null;
  let b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

      const ok = wk >= g.f ? ' class="ok"' : "";
      days += `<div class="week-label"><span>${fmt(t.week, {i: w + 1})}</span><span${ok}>${Math.min(wk, 7)}/${g.f}</span></div><div class="grid">${cells}</div>`;

    <span class="chip ${g.st}">${label}</span></div>
    <div class="bar"><i style="width:${total ? Math.round(100 * count / total) : 0}%"></i></div>
    <div class="count">${count}/${total}</div>
    ${days}
  </div>`;
}

function render() {
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  let data = null;
  try { data = decode(location.hash); } catch (e) { data = null; }
  if (!data && !inTelegram) { renderSite(); return; }      // tarayıcıdan gelen ziyaretçi: tanıtım sayfası
  if (tg) { tg.ready(); tg.expand(); }
  const lang = (data && UI[data.l]) ? data.l : ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && UI[tg.initDataUnsafe.user.language_code]) ? tg.initDataUnsafe.user.language_code : "en");
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.includes(lang) ? "rtl" : "ltr";
  const app = document.getElementById("app");
  if (!data) { app.innerHTML = `<div class="empty">${t.nodata}</div>`; return; }
  const finished = data.g.filter(g => g.st !== "active");
  const wins = data.g.filter(g => g.st === "success").length;
  const rate = finished.length ? Math.round(100 * wins / finished.length) + "%" : "—";
  const daysDone = data.g.reduce((a, g) => a + g.k.length, 0);
  const best = data.g.reduce((a, g) => Math.max(a, g.k.length), 0);
  const badges = BADGES.map(b => `<span class="badge${data.b.includes(b) ? "" : " off"}">${t.badge_names[b]}</span>`).join("");
  app.innerHTML = `
    <div class="hero"><div class="logo">⭐</div><div><h1>${esc(data.n || t.title)}${data.p ? " 👑" : ""}</h1><p>${t.title}</p></div></div>
    <div class="stats">
      <div class="stat"><b>${data.g.length}</b><span>${t.goals}</span></div>
      <div class="stat"><b>${rate}</b><span>${t.success}</span></div>
      <div class="stat"><b>${daysDone}</b><span>${t.days}</span></div>
      <div class="stat"><b>${best}</b><span>${t.best}</span></div>
    </div>
    <h2>${t.badges}</h2><div class="badges">${badges}</div>
    <h2>${t.my_goals}</h2>
    ${data.g.length ? data.g.map(g => goalCard(g, t)).join("") : `<div class="empty">${t.empty}</div>`}
    <div class="legend"><span class="l-done">${t.legend_done}</span><span class="l-missed">${t.legend_missed}</span><span class="l-today">${t.legend_today}</span><span class="l-pause">${t.legend_pause}</span></div>`;
}
render();
window.addEventListener("hashchange", render);
</script>
</body>
</html>
